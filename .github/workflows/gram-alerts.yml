# GRAM / TON Telegram alerts — runs without the browser
#
# Setup (one-time):
# 1. Put this repo on GitHub
# 2. Settings → Secrets and variables → Actions → New repository secret:
#      TELEGRAM_BOT_TOKEN   = token from @BotFather
#      TELEGRAM_CHAT_ID     = your chat id (e.g. from @userinfobot)
#    Optional secrets:
#      WALLET_ADDRESS       = EQCw1-hJcfl_YlneBdXmw2OHNx9CO76r5fDrl4gCI4uaf7wR
#      ALERT_ABOVE          = 1.60
#      ALERT_BELOW          = 1.40
#      ALERT_PROFIT_PCTS    = 5,10
#      ALERT_LOSS_PCTS      = 5,10
#      STARTING_CAPITAL     = 200
# 3. Enable Actions on the repo
#
# Schedule: every 5 minutes (GitHub may delay a bit under load)

name: GRAM Telegram Alerts

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      report:
        description: "Send a full status report even if no threshold hit"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Restore alert cooldown state
        uses: actions/cache@v4
        with:
          path: .alert-state.json
          key: alert-state-${{ github.repository }}
          restore-keys: |
            alert-state-

      - name: Run alert check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WALLET_ADDRESS: ${{ secrets.WALLET_ADDRESS }}
          ALERT_ABOVE: ${{ secrets.ALERT_ABOVE }}
          ALERT_BELOW: ${{ secrets.ALERT_BELOW }}
          ALERT_PROFIT_PCTS: ${{ secrets.ALERT_PROFIT_PCTS }}
          ALERT_LOSS_PCTS: ${{ secrets.ALERT_LOSS_PCTS }}
          STARTING_CAPITAL: ${{ secrets.STARTING_CAPITAL }}
          REPORT: ${{ github.event.inputs.report == 'true' && '1' || '' }}
          STATE_PATH: .alert-state.json
        run: node scripts/ton-alert.mjs

      - name: Persist alert cooldown state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .alert-state.json
          key: alert-state-${{ github.repository }}-${{ github.run_id }}
