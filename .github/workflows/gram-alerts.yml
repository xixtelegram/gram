# GRAM / TON Telegram alerts — runs without the browser
#
# Secrets:
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID (required)
#   WALLET_ADDRESS, ALERT_ABOVE, ALERT_BELOW, ALERT_PROFIT_PCTS,
#   ALERT_LOSS_PCTS, STARTING_CAPITAL (optional)

name: GRAM Telegram Alerts

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      report:
        description: "Send a full status report even if no threshold hit"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Restore alert state
        uses: actions/cache@v4
        with:
          path: .alert-state.json
          key: alert-state-v2-${{ github.repository }}
          restore-keys: |
            alert-state-v2-
            alert-state-

      - name: Run alert check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WALLET_ADDRESS: ${{ secrets.WALLET_ADDRESS }}
          ALERT_ABOVE: ${{ secrets.ALERT_ABOVE }}
          ALERT_BELOW: ${{ secrets.ALERT_BELOW }}
          ALERT_PROFIT_PCTS: ${{ secrets.ALERT_PROFIT_PCTS }}
          ALERT_LOSS_PCTS: ${{ secrets.ALERT_LOSS_PCTS }}
          STARTING_CAPITAL: ${{ secrets.STARTING_CAPITAL }}
          REPORT: ${{ github.event.inputs.report == 'true' && '1' || '' }}
          STATE_PATH: .alert-state.json
        run: node scripts/ton-alert.mjs

      - name: Save alert state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .alert-state.json
          key: alert-state-v2-${{ github.repository }}
