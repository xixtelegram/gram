# GRAM Telegram alerts — secrets never live in source code
# Required repository secrets:
#   TELEGRAM_BOT_TOKEN
#   TELEGRAM_CHAT_ID
#   WALLET_ADDRESS
# Optional:
#   ALERT_ABOVE, ALERT_BELOW, ALERT_PROFIT_PCTS, ALERT_LOSS_PCTS

name: GRAM Telegram Alert

on:
  schedule:
    # every 15 minutes
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      report:
        description: "Send full status report even without trigger"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run ton-alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WALLET_ADDRESS: ${{ secrets.WALLET_ADDRESS }}
          ALERT_ABOVE: ${{ secrets.ALERT_ABOVE }}
          ALERT_BELOW: ${{ secrets.ALERT_BELOW }}
          ALERT_PROFIT_PCTS: ${{ secrets.ALERT_PROFIT_PCTS }}
          ALERT_LOSS_PCTS: ${{ secrets.ALERT_LOSS_PCTS }}
          REPORT: ${{ github.event.inputs.report || '' }}
        run: node scripts/ton-alert.mjs
