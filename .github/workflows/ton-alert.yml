# هشدار تلگرام وقتی سایت بسته است
# Secrets لازم (Settings → Secrets and variables → Actions):
#   TELEGRAM_BOT_TOKEN
#   TELEGRAM_CHAT_ID
#   WALLET_ADDRESS
# اختیاری:
#   ALERT_ABOVE, ALERT_BELOW, ALERT_PROFIT_PCTS, ALERT_LOSS_PCTS

name: GRAM Telegram Alert

on:
  schedule:
    # هر ۱۵ دقیقه
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      report:
        description: "گزارش کامل وضعیت بفرست (حتی بدون تریگر)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # state بین اجراها برای cooldown / series قیمت
      - name: Restore alert state
        uses: actions/cache@v4
        with:
          path: .alert-state.json
          key: gram-alert-state-${{ github.run_id }}
          restore-keys: |
            gram-alert-state-

      - name: Run ton-alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WALLET_ADDRESS: ${{ secrets.WALLET_ADDRESS }}
          ALERT_ABOVE: ${{ secrets.ALERT_ABOVE }}
          ALERT_BELOW: ${{ secrets.ALERT_BELOW }}
          ALERT_PROFIT_PCTS: ${{ secrets.ALERT_PROFIT_PCTS }}
          ALERT_LOSS_PCTS: ${{ secrets.ALERT_LOSS_PCTS }}
          REPORT: ${{ github.event_name == 'workflow_dispatch' && inputs.report == 'true' && '1' || '' }}
          EVENT_NAME: ${{ github.event_name }}
          STATE_PATH: .alert-state.json
        run: node scripts/ton-alert.mjs
