# GRAM Telegram Alert Worker — always-on via Cloudflare Cron
# Deploy:  cd worker && npm i && npx wrangler login && npx wrangler deploy
# Secrets: npx wrangler secret put TELEGRAM_BOT_TOKEN
#          npx wrangler secret put TELEGRAM_CHAT_ID
#          npx wrangler secret put WALLET_ADDRESS
#
# KV:      npx wrangler kv namespace create ALERT_STATE
#          → paste the returned id below under [[kv_namespaces]].id

name = "gram-telegram-alert"
main = "src/index.mjs"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Optional thresholds (leave empty to disable ceiling/floor)
ALERT_ABOVE = ""
ALERT_BELOW = ""
ALERT_PROFIT_PCTS = "1,2,3,5"
ALERT_LOSS_PCTS = "1,2,3"

[[kv_namespaces]]
binding = "ALERT_STATE"
# REQUIRED after first create — replace with real id from:
#   npx wrangler kv namespace create ALERT_STATE
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[triggers]
# Every 2 minutes — change if you need denser/sparser checks
crons = ["*/2 * * * *"]
